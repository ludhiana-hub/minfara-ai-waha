# Production — Coolify + Traefik
# Repo root = minfara-bot/, semua path relative ke sini

x-php-env: &php-env
  APP_NAME: "${APP_NAME:-Deutsch Lernen mit Fara}"
  APP_ENV: production
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "false"
  APP_URL: "${APP_URL}"
  APP_LOCALE: en
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  TELESCOPE_ENABLED: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: minfara_bot
  DB_USERNAME: minfara
  DB_PASSWORD: "${DB_PASSWORD}"
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  WAHA_URL: "http://waha:3000"
  WAHA_SESSION: "default"
  WAHA_API_KEY: "${WAHA_API_KEY}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3-32b}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash:free}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minfara-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *php-env
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minfara-net

  nginx:
    image: nginx:1.25-alpine
    container_name: minfara-nginx
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - minfara-net

  mysql:
    image: mysql:8.0
    container_name: minfara-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minfara_bot
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_USER: minfara
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - minfara-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minfara-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    environment:
      <<: *php-env
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minfara-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      <<: *php-env
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_HOOK_URL: "${APP_URL}/api/whatsapp/webhook"
      WHATSAPP_HOOK_EVENTS: "message,message.any,session.status"
    volumes:
      - waha_data:/app/.sessions
    networks:
      - minfara-net

volumes:
  mysql_data:
  waha_data:
  app_storage:
  app_logs:

networks:
  minfara-net:
    driver: bridge
