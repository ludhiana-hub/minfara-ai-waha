# Nginx config untuk Laravel — akses langsung via IP (HTTP)

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/font-woff2;

    location /telescope {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE endpoint — long-lived connection, needs extended timeout
    location = /api/logs/stream {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param        REMOTE_ADDR     $remote_addr;
        fastcgi_read_timeout 3600;
        fastcgi_buffering    off;
    }

    location ~ \.php$ {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        REMOTE_ADDR     $remote_addr;
        fastcgi_read_timeout 60;
    }

    location ~ /\. {
        deny all;
    }
}
