# Nginx config untuk Laravel + Coolify (SSL termination di Traefik)

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/font-woff2;

    # Blok akses langsung ke area admin dari public
    location ^~ /cms-minfara {
        return 403;
    }
    location /telescope {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Penting: beritahu PHP bahwa koneksi dari user adalah HTTPS
        # (Traefik terminate SSL, nginx ke app pakai HTTP)
        fastcgi_param        HTTPS           on;
        fastcgi_param        REMOTE_ADDR     $http_x_forwarded_for;
        fastcgi_read_timeout 60;
    }

    # Deny akses ke file tersembunyi
    location ~ /\. {
        deny all;
    }
}
