# Coolify deployment — Traefik handles SSL termination, nginx only serves HTTP

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    location ^~ /cms-minfara {
        return 403;
    }
    location /telescope {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        REMOTE_ADDR     $http_x_forwarded_for;
        fastcgi_param        HTTPS           on;
        fastcgi_read_timeout 60;
    }

    location ~ /\.ht {
        deny all;
    }
}

# Internal CMS — akses via SSH tunnel: ssh -L 8888:127.0.0.1:8080 user@vps
server {
    listen 8080;
    server_name localhost;
    root /var/www/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass         app:9000;
        fastcgi_index        index.php;
        include              fastcgi_params;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        REMOTE_ADDR     127.0.0.1;
        fastcgi_read_timeout 120;
    }

    location ~ /\.ht {
        deny all;
    }
}
