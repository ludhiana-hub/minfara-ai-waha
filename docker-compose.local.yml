# Local-only dev helper — Adminer web UI for browsing the HOST's existing MySQL server.
# NOT used in production/staging (see docker-compose.prod.yml / docker-compose.dokploy.yml,
# which run their own containerized `mysql` service instead — this file intentionally does
# not touch those).
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   Open http://localhost:8081
#
# Login screen values (matches this repo's local .env):
#   System   : MySQL
#   Server   : host.docker.internal
#   Username : root
#   Password : (leave empty)
#   Database : minfara_bot
#
# Requires Docker Desktop (Windows/Mac) for host.docker.internal to resolve to the host
# machine. On native Linux Docker (no Desktop), add under the adminer service:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# If Adminer shows "Access denied for user 'root'@'...'", the local MySQL's root account is
# likely restricted to localhost/127.0.0.1-only connections (common default). Either widen it
# for local dev use only:
#   CREATE USER 'root'@'%' IDENTIFIED BY '';  GRANT ALL PRIVILEGES ON *.* TO 'root'@'%';
# or create a dedicated low-privilege dev user instead of loosening root.

services:
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal
