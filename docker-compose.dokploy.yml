# Dokploy — Akses langsung via IP + port (tanpa domain, tanpa SSL)
#
# Akses App  : http://187.77.116.47:8080
# Akses WAHA : http://187.77.116.47:3001/dashboard
#
# Port 80   → dipakai Traefik Dokploy (jangan dipakai)
# Port 3000 → dipakai Dokploy dashboard (jangan dipakai)
#
# ENV VARS wajib di Dokploy UI → tab Environment:
#   APP_KEY                 → hasil: php artisan key:generate --show
#   DB_PASSWORD             → bebas, contoh: MinFara2025!
#   WAHA_API_KEY            → bebas, contoh: minfara-secret-key
#   WAHA_DASHBOARD_USERNAME → bebas, contoh: admin
#   WAHA_DASHBOARD_PASSWORD → bebas, contoh: MinFara2025!
#   INTERNAL_API_KEY        → random string ≥32 karakter (untuk auth notifikasi dari CMS)

x-php-env: &php-env
  APP_NAME: "Deutsch Lernen mit Fara"
  APP_ENV: production
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "true"
  APP_URL: "http://187.77.116.47:8080"
  CMS_ALLOWED_IPS: "*"
  APP_LOCALE: en
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  TELESCOPE_ENABLED: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: minfara_bot
  DB_USERNAME: minfara
  DB_PASSWORD: "${DB_PASSWORD}"
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  WAHA_URL: "http://waha:3000"
  WAHA_SESSION: "default"
  WAHA_API_KEY: "${WAHA_API_KEY}"
  INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
  CMS_BASE_URL: "http://187.77.116.47:8080/cms-minfara"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3-32b}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash:free}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
  NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
  NVIDIA_MODEL: "${NVIDIA_MODEL:-qwen/qwen3.5-397b-a17b}"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minfara-net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - minfara-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minfara_bot
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_USER: minfara
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - minfara-net

  queue:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  scheduler:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  waha:
    image: devlikeapro/waha
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_HOOK_URL: "http://187.77.116.47:8080/api/whatsapp/webhook"
      WHATSAPP_HOOK_EVENTS: "message,message.any,session.status"
      WHATSAPP_DEFAULT_ENGINE: "NOWEB"
      WHATSAPP_RESTART_ALL_SESSIONS: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='X-Api-Key: ${WAHA_API_KEY}' http://localhost:3000/api/sessions/default || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - waha_data:/app/.sessions
    networks:
      - minfara-net

volumes:
  mysql_data:
  waha_data:
  app_storage:
  app_logs:

networks:
  minfara-net:
    driver: bridge
