# Dokploy + Traefik — Production
#
# ENV VARS yang wajib di-set di Dokploy UI:
#   APP_DOMAIN              → domain Laravel,  contoh: app.example.com
#   WAHA_DOMAIN             → domain WAHA,     contoh: waha.example.com
#   APP_URL                 → https://app.example.com
#   APP_KEY                 → base64:... (php artisan key:generate --show)
#   DB_PASSWORD             → password MySQL
#   WAHA_API_KEY            → API key untuk WAHA
#   WAHA_DASHBOARD_USERNAME → username dashboard WAHA
#   WAHA_DASHBOARD_PASSWORD → password dashboard WAHA
#
# ENV VARS opsional:
#   GROQ_API_KEY, GROQ_MODEL, OPENROUTER_API_KEY, OPENROUTER_MODEL
#   GEMINI_API_KEY, GEMINI_MODEL

x-php-env: &php-env
  APP_NAME: "${APP_NAME:-Deutsch Lernen mit Fara}"
  APP_ENV: production
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "false"
  APP_URL: "${APP_URL}"
  APP_LOCALE: en
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  TELESCOPE_ENABLED: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: minfara_bot
  DB_USERNAME: minfara
  DB_PASSWORD: "${DB_PASSWORD}"
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  WAHA_URL: "http://waha:3000"
  WAHA_SESSION: "default"
  WAHA_API_KEY: "${WAHA_API_KEY}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3-32b}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash:free}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minfara-net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - minfara-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.minfara-nginx.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.minfara-nginx.entrypoints=websecure"
      - "traefik.http.routers.minfara-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.minfara-nginx.loadbalancer.server.port=80"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.minfara-nginx-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.minfara-nginx-http.entrypoints=web"
      - "traefik.http.routers.minfara-nginx-http.middlewares=minfara-https-redirect@docker"
      - "traefik.http.middlewares.minfara-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.minfara-https-redirect.redirectscheme.permanent=true"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minfara_bot
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_USER: minfara
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - minfara-net

  queue:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=120 --max-jobs=500
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  scheduler:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_HOOK_URL: "${APP_URL}/api/whatsapp/webhook"
      WHATSAPP_HOOK_EVENTS: "message,message.any,session.status"
    volumes:
      - waha_data:/app/.sessions
    networks:
      - minfara-net
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.minfara-waha.rule=Host(`${WAHA_DOMAIN}`)"
      - "traefik.http.routers.minfara-waha.entrypoints=websecure"
      - "traefik.http.routers.minfara-waha.tls.certresolver=letsencrypt"
      - "traefik.http.services.minfara-waha.loadbalancer.server.port=3000"
      # SSE fix: wajib untuk WAHA dashboard real-time update
      - "traefik.http.services.minfara-waha.loadbalancer.responseforwarding.flushinterval=-1ms"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.minfara-waha-http.rule=Host(`${WAHA_DOMAIN}`)"
      - "traefik.http.routers.minfara-waha-http.entrypoints=web"
      - "traefik.http.routers.minfara-waha-http.middlewares=minfara-https-redirect@docker"

volumes:
  mysql_data:
  waha_data:
  app_storage:
  app_logs:

networks:
  minfara-net:
    driver: bridge
  dokploy-network:
    external: true
