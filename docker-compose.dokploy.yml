# Dokploy — di belakang Traefik dengan domain + SSL (Let's Encrypt otomatis)
#
# Akses App  : https://dashboard-ai.mitfara.com
# Akses WAHA : http://187.77.116.47:3001/dashboard
#
# Port 80   → dipakai Traefik Dokploy (jangan dipakai)
# Port 3000 → dipakai Dokploy dashboard (jangan dipakai)
#
# ENV VARS wajib di Dokploy UI → tab Environment:
#   APP_KEY                 → hasil: php artisan key:generate --show
#   DB_PASSWORD             → bebas, contoh: MinFara2025!
#   WAHA_API_KEY            → bebas, contoh: minfara-secret-key
#   WAHA_DASHBOARD_USERNAME → bebas, contoh: admin
#   WAHA_DASHBOARD_PASSWORD → bebas, contoh: MinFara2025!
#   INTERNAL_API_KEY        → random string ≥32 karakter (untuk auth notifikasi dari CMS)
#   SUPER_ADMIN_PASSWORD    → WAJIB di-set sebelum deploy pertama (lihat SuperAdminSeeder) —
#                             kalau kosong, akun admin CMS tidak akan dibuat di production.

x-php-env: &php-env
  APP_NAME: "Deutsch Lernen mit Fara"
  APP_ENV: production
  APP_KEY: "${APP_KEY}"
  # false: APP_DEBUG=true di production membocorkan stack trace lengkap (termasuk isi .env
  # seperti API key & password DB) ke siapa pun yang memicu error di halaman manapun.
  APP_DEBUG: "false"
  APP_URL: "https://dashboard-ai.mitfara.com"
  CMS_ALLOWED_IPS: "*"
  APP_LOCALE: en
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  TELESCOPE_ENABLED: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: minfara_bot
  DB_USERNAME: minfara
  DB_PASSWORD: "${DB_PASSWORD}"
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  WAHA_URL: "http://waha:3000"
  WAHA_SESSION: "default"
  WAHA_API_KEY: "${WAHA_API_KEY}"
  INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
  CMS_BASE_URL: "https://dashboard-ai.mitfara.com/cms-minfara"
  SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-Super Admin}"
  SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-admin@mitfara.com}"
  # Kosong di sini TIDAK apa-apa secara sintaks, tapi SuperAdminSeeder akan MENOLAK bikin akun
  # admin di production kalau ini kosong — wajib di-set di tab Environment Dokploy.
  SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
  GROQ_API_KEY: "${GROQ_API_KEY:-}"
  GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash:free}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
  NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
  NVIDIA_MODEL: "${NVIDIA_MODEL:-qwen/qwen3.5-397b-a17b}"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minfara-net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - minfara-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minfara_bot
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_USER: minfara
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - minfara-net

  queue:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    # --timeout HARUS lebih besar dari job timeout terbesar (ProcessAiReply::$timeout=175s) —
    # kalau lebih kecil, worker SIGKILL job sebelum job sempat timeout & jalankan failed()
    # sendiri, jadi customer tidak dapat balasan fallback sama sekali.
    command: php artisan queue:work --queue=default --sleep=1 --tries=3 --timeout=200 --max-jobs=500
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
      - app_logs:/var/www/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  scheduler:
    image: minfara-bot-app
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      <<: *php-env
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - minfara-net

  waha:
    image: devlikeapro/waha
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_HOOK_URL: "http://187.77.116.47:8080/api/whatsapp/webhook"
      WHATSAPP_HOOK_EVENTS: "message,message.any,session.status"
      WHATSAPP_DEFAULT_ENGINE: "NOWEB"
      WHATSAPP_RESTART_ALL_SESSIONS: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='X-Api-Key: ${WAHA_API_KEY}' http://localhost:3000/api/sessions/default || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - waha_data:/app/.sessions
    networks:
      - minfara-net

  # Adminer — akses database MySQL production lewat browser. WAJIB dilindungi HTTP Basic
  # Auth (via Traefik middleware) karena ini akses mentah ke database, bukan cuma app.
  # Sengaja TIDAK pakai `ports:` (host-published) seperti nginx/waha di atas — kalau
  # port-nya di-publish langsung, basic auth di Traefik bisa dilewati lewat akses IP:port
  # langsung. Adminer hanya bisa diakses lewat domain yang di-routing Traefik + basic auth.
  #
  # Setup:
  #   1. Generate hash password: docker run --rm httpd:alpine htpasswd -nbB admin 'PASSWORD_KUAT_ANDA'
  #      (output contoh: admin:$2y$05$xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx)
  #   2. Set ADMINER_BASIC_AUTH_USER dan ADMINER_BASIC_AUTH_HASH di tab Environment Dokploy
  #      (ADMINER_BASIC_AUTH_HASH = bagian setelah "admin:" di output langkah 1)
  #   3. Assign domain untuk service "adminer" ini di Dokploy UI (sama seperti app/waha)
  #   4. Jangan skip langkah 1-2 — tanpa basic auth, siapa pun yang tahu domainnya bisa akses DB.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minfara-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=${ADMINER_BASIC_AUTH_USER:-admin}:${ADMINER_BASIC_AUTH_HASH:?ADMINER_BASIC_AUTH_HASH belum di-set — lihat komentar di atas}"
      - "traefik.http.routers.adminer.middlewares=adminer-auth"

volumes:
  mysql_data:
  waha_data:
  app_storage:
  app_logs:

networks:
  minfara-net:
    driver: bridge
